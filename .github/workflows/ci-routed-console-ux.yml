name: Cerato Network - Console routage & comptes

on:
  push:
    branches: [feature/routed-first-console-auth-ux]

permissions:
  contents: read

jobs:
  validate:
    name: Authentification, IPv4 /32, URL persistante et Graphite
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependances de test
        run: python3 -m pip install --disable-pip-version-check -r security/requirements.txt
      - name: Tous les tests backend et politiques
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q gateway network security tools scripts integrations tests updates
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check web/app.js
          node --check web/live-auth-overlay.js
          node --check release-assets/routed-nat-panel.js
