name: Cerato Network - Publication signee

# The signing secret is accessible ONLY to the protected environment below.
# Main branch, manually approved release or scheduled index renewal.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version immuable, ex. v0.1.0-beta.1"
        required: true
        type: string
      channel:
        description: "Canal signe"
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      from_version:
        description: "Version OVH cible, ex. v0.0.0"
        required: true
        default: v0.0.0
        type: string
  schedule:
    # Signed indexes expire after seven days. Attempt renewal every four days
    # (every Sunday / Wednesday); environment approvals may delay the job.
    - cron: "23 4 * * 0,3"

concurrency:
  group: cerato-network-signing
  cancel-in-progress: false

jobs:
  signed-release:
    name: Signer une release approuvee et publier sur GitHub
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'EXODEcola/Cerato-Network' && vars.CERATO_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: cerato-network-signing
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_PRIVATE_PEM: ${{ secrets.CERATO_ED25519_PRIVATE_PEM }}
      TRUSTED_PUBLIC_SHA256: ${{ vars.CERATO_SIGNING_PUBLIC_SHA256 }}
      REQUEST_VERSION: ${{ inputs.version }}
      REQUEST_CHANNEL: ${{ inputs.channel }}
      REQUEST_FROM_VERSION: ${{ inputs.from_version }}
    steps:
      - name: Checkout du commit main approuve
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Garde-fous de la signature
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_PRIVATE_PEM"
          [[ "$TRUSTED_PUBLIC_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUEST_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)\.[0-9]+))?$ ]]
            [[ "$REQUEST_FROM_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)\.[0-9]+))?$ ]]
            if [[ "$REQUEST_CHANNEL" == "beta" ]]; then
              [[ "$REQUEST_VERSION" == *-beta.* ]]
            else
              [[ "$REQUEST_VERSION" != *-* ]]
            fi
          fi
      - name: Installer les dependances de test
        run: python3 -m pip install --disable-pip-version-check -r security/requirements.txt
      - name: Tests complets AVANT signature
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check web/app.js
      - name: Installer la cle uniquement dans la machine ephemere
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/cerato-trust"
          printf '%s\n' "$SIGNING_PRIVATE_PEM" > "$RUNNER_TEMP/cerato-trust/signing.key"
          chmod 600 "$RUNNER_TEMP/cerato-trust/signing.key"
          openssl pkey -in "$RUNNER_TEMP/cerato-trust/signing.key" -pubout \
            -out "$RUNNER_TEMP/cerato-trust/release-verification.pub"
          ACTUAL="$(openssl pkey -pubin -in "$RUNNER_TEMP/cerato-trust/release-verification.pub" -outform DER | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL" = "$TRUSTED_PUBLIC_SHA256"
      - name: Construire une nouvelle release visuelle ou rafraichir l'index
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/cerato-public"
          mkdir -p "$OUT/release" "$OUT/channels"
          KEY="$RUNNER_TEMP/cerato-trust/signing.key"
          PUB="$RUNNER_TEMP/cerato-trust/release-verification.pub"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            CHANNEL=beta
            VERSION="$(gh release list --limit 40 --json tagName,isPrerelease,isDraft \
              -q '[.[] | select(.isDraft == false and .isPrerelease == true) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$"))] | first // ""')"
            if [[ -z "$VERSION" ]]; then
              echo "Aucune beta signee a renouveler."
              echo "CERATO_NO_RELEASE=true" >> "$GITHUB_ENV"
              exit 0
            fi
            gh release download "$VERSION" --dir "$OUT/release" \
              --pattern 'manifest.json' --pattern 'manifest.sig' --pattern 'cerato-network-release.zip'
            python3 tools/release_pipeline.py verify --output "$OUT/release" --public-key "$PUB"
          else
            VERSION="$REQUEST_VERSION"
            CHANNEL="$REQUEST_CHANNEL"
            FROM="$REQUEST_FROM_VERSION"
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "La release immutable existe deja: $VERSION" >&2
              exit 1
            fi
            mkdir -p "$OUT/source"
            cp LICENSE README.md "$OUT/source/"
            python3 tools/compose_css_release.py \
              --source release-assets/graphite-operations.css \
              --destination "$OUT/source/live-overlay" --from-version "$FROM"
            python3 tools/release_pipeline.py prepare --source "$OUT/source" \
              --output "$OUT/release" --version "$VERSION"
            python3 tools/release_pipeline.py sign --output "$OUT/release" \
              --signing-key "$KEY"
            python3 tools/release_pipeline.py verify --output "$OUT/release" --public-key "$PUB"
          fi
          python3 tools/channel_index.py --release "$OUT/release" \
            --channel "$CHANNEL" --output "$OUT/channels" \
            --signing-key "$KEY" --public-key "$PUB" --valid-seconds 604800
          python3 tools/stage_signed_static_release.py \
            --release "$OUT/release" --channels "$OUT/channels" \
            --public-key "$PUB" --channel "$CHANNEL" --destination "$OUT/verified"
          echo "CERATO_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CERATO_RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Publier seulement des assets signes
        if: ${{ env.CERATO_NO_RELEASE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cerato-public"
          VERSION="$CERATO_RELEASE_VERSION"
          CHANNEL="$CERATO_RELEASE_CHANNEL"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            gh release upload "$VERSION" "$OUT/channels/$CHANNEL.json" "$OUT/channels/$CHANNEL.sig" --clobber
          else
            options=(--target "$GITHUB_SHA" --title "Cerato Network $VERSION"
                     --notes "Release Graphite CSS signee Ed25519. Aucun backend ni JavaScript remplace."
                     --latest=false)
            if [[ "$CHANNEL" == "beta" ]]; then options+=(--prerelease); fi
            gh release create "$VERSION" \
              "$OUT/release/manifest.json" "$OUT/release/manifest.sig" \
              "$OUT/release/cerato-network-release.zip" \
              "$OUT/channels/$CHANNEL.json" "$OUT/channels/$CHANNEL.sig" \
              "$RUNNER_TEMP/cerato-trust/release-verification.pub" \
              "${options[@]}"
          fi
          echo "Release GitHub publiee, OVH non modifie."
