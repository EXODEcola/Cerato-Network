name: Cerato Network - Validation environnement Python auth isolé
on:
  push:
    branches: [feature/native-auth-isolated-python-runtime]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances de test
        run: python3 -m pip install --disable-pip-version-check -r security/requirements.txt
      - name: Suite backend, sécurité et runtime isolé
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q integrations security gateway network updates tests tools
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check web/app.js
          node --check web/live-auth-overlay.js
          node tests/test_frontend_navigation.cjs
          node tests/test_native_auth_transport.cjs
