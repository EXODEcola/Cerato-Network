name: Cerato Network - Validation permission fichier de verrouillage

on:
  push:
    branches: [fix/update-service-ceratoctl-lock]

permissions:
  contents: read

jobs:
  validate:
    name: Verifier correctif systemd sans toucher OVH
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r security/requirements.txt
      - name: Compilation et tests complets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools scripts tests updates integrations
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check web/app.js
          node --check web/live-auth-overlay.js
