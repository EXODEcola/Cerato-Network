name: Cerato Network - Reproduction permission sandbox root
on:
  push:
    branches: [fix/native-auth-sandbox-child-diagnostics]
permissions:
  contents: read
jobs:
  linux-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved test crypto dependencies
        run: python3 -m pip install -r security/requirements.txt
      - name: Reproduce real Linux root and unprivileged runtime isolation
        run: sudo -E $(which python3) -B tests/ci_root_owned_auth_sandbox.py
      - name: Full regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node tests/test_native_auth_transport.cjs
          node tests/test_frontend_navigation.cjs
