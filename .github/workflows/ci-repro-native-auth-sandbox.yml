name: Cerato Network - Reproduction permission sandbox root
on:
  push:
    branches: [fix/native-auth-sandbox-missing-module-diagnostic]
permissions:
  contents: read
jobs:
  linux-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved test crypto dependencies
        run: python3 -m pip install -r security/requirements.txt
      - name: Reproduce real Linux root and isolated venv under runuser
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d /var/tmp/cerato-ci-auth-venv.XXXXXXXX)
          trap 'sudo rm -rf -- "$TMP"' EXIT
          chmod 0755 "$TMP"
          python3 -m venv "$TMP/venv"
          "$TMP/venv/bin/python" -m pip install --disable-pip-version-check -r security/requirements.txt
          sudo chown -R root:root "$TMP"
          sudo chmod -R a+rX "$TMP"
          sudo env CERATO_AUTH_CI_PYTHON="$TMP/venv/bin/python" \
            "$(which python3)" -B tests/ci_root_owned_auth_sandbox.py
      - name: Full regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node tests/test_native_auth_transport.cjs
          node tests/test_frontend_navigation.cjs
