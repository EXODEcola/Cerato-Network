name: Cerato Network - Verification filtrage des versions dev

on:
  push:
    branches: [fix/mirror-ignore-dev-versions]

permissions:
  contents: read

jobs:
  test:
    name: Valider le miroir beta et la non-installabilite dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer dependances de test
        run: python3 -m pip install --disable-pip-version-check -r security/requirements.txt
      - name: Suite complete
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools updates network tests integrations
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --check web/app.js
          node --check web/live-auth-overlay.js
