# Cerato Network — EXAMPLE ONLY (replace hostnames/certificates before use)
# Not installed or reloaded automatically. Requires:
# - a valid HTTPS certificate,
# - a development/test gateway on 127.0.0.1:8788,
# - CERATO_WEB_ORIGIN=https://network.example.org,
# - CERATO_TRUST_LOCAL_PROXY=1.
#
# IMPORTANT: X-Real-IP is always OVERWRITTEN by Nginx, not forwarded from
# the user. The Python process must NOT listen on a public interface.

limit_req_zone $binary_remote_addr zone=cerato_auth:10m rate=10r/m;

server {
    listen 80;
    server_name network.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name network.example.org;

    ssl_certificate     /etc/letsencrypt/live/network.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/network.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    location /api/auth/ {
        limit_req zone=cerato_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
