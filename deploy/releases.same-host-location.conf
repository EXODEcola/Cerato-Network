# Cerato Network — public signed artifacts on the existing HTTPS gateway.
#
# Place this exact block INSIDE the active 'server { listen 443 ssl; ... }'
# serving https://51.210.223.57/ . Do not create a second overlapping 443
# server. Preserve the existing HTTPS certificate, /api/, dashboard and
# HTTP Basic access control elsewhere.
#
# IMPORTANT: This location is deliberately PUBLIC for GET/HEAD of ALLOWLISTED
# signed artifacts. Never publish private keys, user databases, .env files or
# staging folders here. The updater still pins an independently approved
# Ed25519 public key and verifies signed manifest + archive before installing.
#
# On-disk files should look like:
#   /srv/cerato-releases/public/cerato-releases/channels/beta.json
#   /srv/cerato-releases/public/cerato-releases/channels/beta.sig
#   /srv/cerato-releases/public/cerato-releases/releases/v0.1.0-beta.1/manifest.json
#   /srv/cerato-releases/public/cerato-releases/releases/v0.1.0-beta.1/manifest.sig
#   /srv/cerato-releases/public/cerato-releases/releases/v0.1.0-beta.1/cerato-network-release.zip
#
# Do not install this location until the TLS cert is VALID FOR THE IP,
# the active server{} block has been reviewed, and signed releases exist.
location ^~ /cerato-releases/ {
    # Override inherited Browser HTTP Basic only for public signed releases.
    auth_basic off;
    limit_except GET HEAD { deny all; }
    autoindex off;
    # Unlike alias, root maps URL prefix to the identical filesystem prefix.
    root /srv/cerato-releases/public;

    # Whitelist both channels and exactly the three immutable release files.
    # Disallows staging, .env, dotfiles, directories and arbitrary uploads.
    if ($uri !~ "^/cerato-releases/(channels/(stable|beta)\.(json|sig)|releases/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?/(manifest\.json|manifest\.sig|cerato-network-release\.zip))$") {
        return 404;
    }
    try_files $uri =404;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    default_type application/octet-stream;
}
