# Cerato Network release distribution — static HTTPS sample
#
# Demonstration only. This file is NOT installed by the project.
# Replace domain, certificates and path on a dedicated distribution host.
# The distribution host has NO Ed25519 private signing key.
#
# Public directory (read-only by nginx):
#   /srv/cerato-releases/public/cerato/channels/stable.json
#   /srv/cerato-releases/public/cerato/channels/stable.sig
#   /srv/cerato-releases/public/cerato/releases/vX.Y.Z/manifest.json
#   /srv/cerato-releases/public/cerato/releases/vX.Y.Z/manifest.sig
#   /srv/cerato-releases/public/cerato/releases/vX.Y.Z/cerato-network-release.zip
#
# Publication must atomically replace a WHOLE snapshot via symlink,
# never rewrite an already published release.

server {
    listen 80;
    server_name releases.example.org;
    return 301 https://releases.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name releases.example.org;

    ssl_certificate     /etc/letsencrypt/live/releases.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Publish a pre-verified tree, served read-only.
    root /srv/cerato-releases/public;
    autoindex off;
    limit_except GET HEAD { deny all; }

    location ~ /\. {
        deny all;
    }

    location /cerato/ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/json json;
            application/octet-stream sig zip;
        }
        default_type application/octet-stream;
    }

    location / {
        return 404;
    }
}
